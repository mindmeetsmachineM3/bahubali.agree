name: bharatNova post

# 07:30 IST Reel (agri knowledge) | 12:30 IST carousel or post (needs variable ENABLE_NOON=on) | 18:30 IST product ad (needs ENABLE_EVENING=on)
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to make"
        type: choice
        default: reel_agri
        options: [reel_agri, reel_ad, carousel, post, product_carousel, product_post, noon, evening]
      topic:
        description: "Optional topic (empty = AI picks a new one)"
        required: false
        default: ""
      dry_run:
        description: "Make it but do NOT post (use for the first test)"
        type: boolean
        default: true
      diagnose:
        description: "Only check the Instagram token and quota"
        type: boolean
        default: false

concurrency:
  group: bharatnova-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      IG_HANDLE: ${{ vars.IG_HANDLE }}
      BRAND_NAME: ${{ vars.BRAND_NAME }}
      BRAND_MARK: ${{ vars.BRAND_MARK }}
      VOICE_FEMALE: ${{ vars.VOICE_FEMALE }}
      VOICE_MALE: ${{ vars.VOICE_MALE }}
      VOICE_RATE: ${{ vars.VOICE_RATE }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
      SARVAM_FEMALE: ${{ vars.SARVAM_FEMALE }}
      SARVAM_MALE: ${{ vars.SARVAM_MALE }}
      SARVAM_MODEL: ${{ vars.SARVAM_MODEL }}
      SARVAM_PACE: ${{ vars.SARVAM_PACE }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      GEMINI_TTS_VOICE_F: ${{ vars.GEMINI_TTS_VOICE_F }}
      GEMINI_TTS_VOICE_M: ${{ vars.GEMINI_TTS_VOICE_M }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_STYLE_F: ${{ vars.GEMINI_TTS_STYLE_F }}
      GEMINI_TTS_STYLE_M: ${{ vars.GEMINI_TTS_STYLE_M }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide what to make
        id: k
        run: |
          case "${{ github.event.schedule }}" in
            "0 2 * * *")  K=reel_agri; ON=on ;;
            "0 7 * * *")  K=noon;      ON="${{ vars.ENABLE_NOON }}" ;;
            "0 13 * * *") K=evening;   ON="${{ vars.ENABLE_EVENING }}" ;;
            *)            K="${{ inputs.kind }}"; ON=on ;;
          esac
          echo "kind=$K" >> "$GITHUB_OUTPUT"
          echo "run=$([ "$ON" = "on" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Check token and quota
        if: ${{ inputs.diagnose }}
        run: python core.py --diagnose

      - name: Install ffmpeg (from PyPI, no apt mirror needed)
        if: ${{ !inputs.diagnose && steps.k.outputs.run == 'yes' }}
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            pip install imageio-ffmpeg
            FF="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Make and post (the bot also adds one comment under the post)
        if: ${{ !inputs.diagnose && steps.k.outputs.run == 'yes' }}
        env:
          KIND: ${{ steps.k.outputs.kind }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          ARGS="--kind $KIND"
          if [ "$INPUT_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$INPUT_TOPIC" ]; then ARGS="$ARGS --topic \"$INPUT_TOPIC\""; fi
          for attempt in 1 2 3; do
            eval python bharatnova.py $ARGS && exit 0
            rc=$?
            if [ "$rc" -eq 3 ]; then echo "Posting failed (token/account problem): not retrying."; exit 3; fi
            echo "attempt $attempt failed"; sleep 30
          done
          exit 1

      - name: Save state (topics never repeat)
        if: ${{ success() && steps.k.outputs.run == 'yes' && (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.diagnose)) }}
        run: |
          if [ -f state.json ]; then
            git config user.name "bharatnova-bot"
            git config user.email "bharatnova-bot@users.noreply.github.com"
            git add state.json
            if git diff --cached --quiet; then echo "no state change"; else
              git commit -m "state: update posted topics"
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push
            fi
          fi

      - name: Keep output (14 days)
        if: ${{ always() && !inputs.diagnose }}
        uses: actions/upload-artifact@v4
        with:
          name: bharatnova-output
          path: output/
          retention-days: 14
          if-no-files-found: ignore
